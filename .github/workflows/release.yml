name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank for the latest release tag)'
        required: false
        type: string
      pr:
        description: 'Pull request number (blank for a draft)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="$(git tag --sort=-creatordate --list | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed -n '1p')"
          fi

          git checkout --detach "refs/tags/${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Select release token
        id: release-token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actor_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --jq '.triggering_actor.id')"
          echo "secret-name=PAT_${actor_id}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up JDK 8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '8'
          cache-jdk: true

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || 'MTJwaXQtZW5jcnlwdGlvbg==' }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble -Prelease --no-daemon --console=plain

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/libs/12pit.jar

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets[steps.release-token.outputs.secret-name] || github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          RELEASE_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          draft="$(node <<'NODE'
          const { execFileSync, spawnSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const repositoryUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          const versionOf = tag => {
            const [major, minor, patch = 0] = tag.split('.').map(Number);
            return [major, minor, patch];
          };
          const target = versionOf(tag);
          const releases = JSON.parse(execFileSync('gh', [
            'api', '--paginate', '--slurp',
            `repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`
          ], { encoding: 'utf8' })).flat()
            .filter(release => !release.draft && !release.prerelease)
            .sort((a, b) => b.published_at.localeCompare(a.published_at));
          const previous = releases.find(release => {
            const version = versionOf(release.tag_name);
            return (version[0] - target[0] || version[1] - target[1] || version[2] - target[2]) < 0;
          });
          const historyUrl = `${repositoryUrl}/compare/${previous.tag_name}...${tag}`;
          const pr = process.env.RELEASE_PR.trim();
          let notes = '';
          let draft = true;
          if (pr) {
            const result = spawnSync('gh', [
              'pr', 'view', '--repo', process.env.GITHUB_REPOSITORY, '--json', 'body', '--jq', '.body', '--', pr
            ], { encoding: 'utf8' });
            if (result.status === 0) {
              notes = result.stdout.replace(/\r\n?/g, '\n').trim();
              draft = false;
            } else {
              process.stderr.write(result.stderr);
              console.warn('::warning::Could not read the pull request. Creating a draft.');
            }
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const paragraphs = [
            notes,
            `For a complete list of changes, see the [commit history](${historyUrl}).`,
            `_The attached JAR was built from commit [${commit.slice(0, 7)}](${repositoryUrl}/commit/${commit}) by [GitHub Actions](${repositoryUrl}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}). You can click [here](${process.env.ATTESTATION_URL}) to view the build provenance attestation._`
          ];
          writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, paragraphs.filter(Boolean).join('\n\n') + '\n');
          console.log(draft);
          NODE
          )"

          gh release create "${RELEASE_TAG}" \
            build/libs/12pit.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "12pit ${RELEASE_TAG}" \
            --verify-tag \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --draft="${draft}"
