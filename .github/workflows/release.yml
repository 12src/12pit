name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target tag (blank for the latest tag)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Draft release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="$(git tag --sort=-creatordate --list --exclude nightly | sed -n '1p')"
          fi

          if [[ "${RELEASE_TAG}" == nightly ]]; then
            echo '::error::The nightly tag cannot be used for a release.'
            exit 1
          fi

          git show-ref --verify "refs/tags/${RELEASE_TAG}" > /dev/null
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Select release token
        id: release-token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actor_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --jq '.triggering_actor.id')"
          echo "secret-name=PAT_${actor_id}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Gradle configuration
        if: env.GRADLE_ENCRYPTION_KEY != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: cc-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            cc-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble -PreleaseBuild=true --no-daemon --console=plain

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/libs/*.jar

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets[steps.release-token.outputs.secret-name] || github.token }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"

          gh release create "${RELEASE_TAG}" \
            build/libs/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "12pit ${RELEASE_TAG}" \
            --verify-tag \
            --notes "_The attached JARs were built from commit [${commit_sha::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${commit_sha}) by [GitHub Actions](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}). You can click [here](${ATTESTATION_URL}) to view the build provenance attestation._" \
            --draft
