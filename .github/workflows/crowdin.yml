name: Crowdin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin-sources
  queue: max

jobs:
  upload:
    name: Upload source text
    if: github.repository == '12src/12pit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Extract source text
        run: python3 scripts/languages.py extract

      - name: Check main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${GITHUB_SHA}" == "${branch_sha}" ]]; then
            echo 'current=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'Skipping upload because main has moved.'
          fi

      - name: Upload source text
        if: steps.revision.outputs.current == 'true'
        uses: crowdin/github-action@v3
        with:
          source: build/generated/languages/12pit.pot
          translation: src/main/resources/assets/pit12/languages/%locale%.po
          upload_sources: true
          upload_translations: false
          download_translations: false
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
