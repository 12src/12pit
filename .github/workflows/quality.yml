name: Quality

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  pmd:
    name: Run PMD
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache-jdk: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || 'MTJwaXQtZW5jcnlwdGlvbg==' }}

      - name: Run PMD
        run: |
          chmod +x gradlew
          ./gradlew pmdMain pmdTest --continue --no-daemon --console=plain

      - name: Upload PMD reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: PMD
          path: build/reports/pmd/

  spotbugs:
    name: Run SpotBugs
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache-jdk: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || 'MTJwaXQtZW5jcnlwdGlvbg==' }}

      - name: Run SpotBugs
        run: |
          chmod +x gradlew
          ./gradlew spotbugsMain spotbugsTest --continue --no-daemon --console=plain

      - name: Upload SpotBugs reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: SpotBugs
          path: build/reports/spotbugs/
          if-no-files-found: error
