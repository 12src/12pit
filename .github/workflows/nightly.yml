name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  release:
    name: Release nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git tag --force nightly
          git push --force origin refs/tags/nightly
          commit_sha="$(git rev-parse HEAD)"
          release_notes="This nightly build was compiled from commit [${commit_sha::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${commit_sha})."

          if gh release view nightly --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release edit nightly \
              --repo "${GITHUB_REPOSITORY}" \
              --notes "${release_notes}"
            gh release upload nightly build/libs/12pit.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create nightly build/libs/12pit.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --title Nightly \
              --notes "${release_notes}" \
              --prerelease
          fi
