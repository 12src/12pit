name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  release:
    name: Release nightly
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up JDK 8
        id: java-toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '8'
          cache-jdk: true

      - name: Set up JDK 25
        id: java-gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Gradle configuration
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/configuration-cache
          key: cc-${{ matrix.os }}-${{ runner.arch }}-${{ steps.java-toolchain.outputs.version }}-${{ steps.java-gradle.outputs.version }}-${{ github.workflow }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            cc-${{ matrix.os }}-${{ runner.arch }}-${{ steps.java-toolchain.outputs.version }}-${{ steps.java-gradle.outputs.version }}-${{ github.workflow }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble -Dorg.gradle.internal.configuration-cache.encryption=false --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git tag --force nightly
          git push --force origin refs/tags/nightly
          commit_sha="$(git rev-parse HEAD)"
          release_notes="_The attached JAR was built from commit [${commit_sha::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${commit_sha}) by [GitHub Actions](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT})._"

          if gh release view nightly --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release edit nightly \
              --repo "${GITHUB_REPOSITORY}" \
              --notes "${release_notes}"
            gh release upload nightly build/libs/12pit.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create nightly build/libs/12pit.jar \
              --repo "${GITHUB_REPOSITORY}" \
              --title "12pit Nightly" \
              --notes "${release_notes}" \
              --prerelease
          fi
